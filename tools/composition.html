<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenMusic</title>
<script src="./gsap.min.js"></script>
<style>
  html,body { margin:0; width:1280px; height:720px; overflow:hidden; background:#080b17; color:#edf5fa; font-family:system-ui,sans-serif; }
  #openmusic { position:relative; width:1280px; height:720px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  h1 { position:absolute; left:90px; top:50%; max-width:530px; margin:0; transform:translateY(-50%); font-size:135px; line-height:.85; letter-spacing:-.077em; font-weight:630; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main id="openmusic" data-composition-id="openmusic" data-start="0" data-duration="__SECONDS__" data-width="1280" data-height="720">
  <canvas id="prism" width="1280" height="720" aria-hidden="true"></canvas>
  <h1>__TITLE__</h1>
  <audio id="master" src="./master.wav" data-start="0" data-duration="__SECONDS__" data-track-index="1" data-volume="1"></audio>
</main>
<script>
__PRISM__
const music = __TIMELINE__;
const render = createPrism(document.getElementById("prism"));
if (!render) throw new Error("WebGL is required for the prism composition");
const cursor = { time: 0 };
function draw() {
  render(prismFrame(cursor.time, music.bpm, music.cues));
}
const timeline = gsap.timeline({ paused: true });
timeline.to(cursor, { time: music.seconds, duration: music.seconds, ease: "none", onUpdate: draw });
window.__timelines = { openmusic: timeline };
draw();
</script>
</body>
</html>
