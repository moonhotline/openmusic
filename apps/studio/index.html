<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>OpenMusic Studio</title>
  <link rel="stylesheet" href="/studio/studio.css">
  <script type="module" src="/apps/studio/main.js"></script>
</head>
<body>
  <header class="page-header">
    <a class="identity" href="/">OpenMusic</a>
    <button id="export" class="quiet" type="button">导出 WAV</button>
  </header>
  <main class="workspace">
    <div class="project-header">
      <div><h1 id="score-title"></h1><p id="tempo"></p></div>
      <span id="revision"></span>
    </div>
    <div class="desk">
      <section class="arrangement" aria-label="多轨乐谱">
        <div class="transport">
          <button id="play" class="primary" type="button">播放</button>
          <div class="scrub">
            <div id="wave" class="wave" aria-hidden="true"></div>
            <input id="seek" type="range" min="0" max="18.29" step="any" value="0" aria-label="播放位置">
          </div>
          <output id="time" for="seek"></output>
        </div>
        <div class="track-scroll">
          <div class="track-grid">
            <div class="ruler"><span>音轨</span><div id="bars" aria-label="小节尺"></div><span>增益</span></div>
            <ol id="tracks"></ol>
          </div>
        </div>
        <details class="details reference">
          <summary>《Mist》参考母带</summary>
          <audio controls preload="none" src="/audio/mist.wav"></audio>
        </details>
      </section>
      <section class="review" aria-labelledby="review-title">
        <div class="section-header"><h2 id="review-title">Agent 提案</h2><span id="review-state"></span></div>
        <p id="summary"></p>
        <ul id="changes"></ul>
        <div id="auditions" class="auditions" role="group" aria-label="选择试听版本">
          <button id="baseline" type="button" aria-pressed="true">A · 当前</button>
          <button id="candidate" type="button" aria-pressed="false">B · 提案</button>
        </div>
        <div id="decision" class="decision">
          <button id="accept" class="primary" type="button">采纳</button>
          <button id="reject" class="quiet" type="button">驳回</button>
        </div>
        <p id="notice" role="status" aria-live="polite"></p>
        <details class="details">
          <summary>导入 Agent 提案</summary>
          <form id="import">
            <label for="proposal">提案 JSON</label>
            <textarea id="proposal" rows="5" required spellcheck="false"></textarea>
            <button class="quiet" type="submit">加载提案</button>
          </form>
        </details>
        <details class="details">
          <summary>连接共享项目</summary>
          <form id="connect">
            <label for="endpoint">Cloudflare Worker 地址</label>
            <input id="endpoint" type="url" required value="https://openmusic.moonhotline.workers.dev">
            <label for="review-token">审核令牌</label>
            <input id="review-token" type="password" required autocomplete="off">
            <button class="quiet" type="submit">连接或刷新</button>
          </form>
          <form id="cloud-audio" hidden>
            <label for="gain-db">流式处理增益（dB）</label>
            <input id="gain-db" type="number" min="-60" max="18" step="any" value="0" required>
            <button id="cloud-export" class="quiet" type="submit">云端处理并导出 WAV</button>
          </form>
        </details>
      </section>
    </div>
  </main>
</body>
</html>
